# kafka-lab: a small Kafka platform that breaks on demand, for the incident
# agent (research on Bayesian investigation, and the on-call demo).
#
# One broker (Kafka 4.0, KRaft), one producer, a group of three consumers.
# Producer and consumers are Java, so GC pauses and rebalances are real.
# Faults are injected by inject/*.sh: most of them write knobs into
# state/knobs.json, which the apps re-read every second; quotas go through
# kafka-configs. probes/*.sh run the checks an on-call engineer would run and
# print their raw output.
#
# Self-contained on purpose: no dependency on the other tools of flux7-stack,
# so the folder can be published alone.

x-app: &app
  build: ./app
  image: flux7/kafka-lab-app:local
  depends_on:
    kafka:
      condition: service_healthy
  volumes:
    - ./state:/state
    - ./logs:/logs
  environment: &app-env
    BOOTSTRAP: kafka:29092
    TOPIC: orders
    GROUP: lab

x-consumer: &consumer
  <<: *app
  command: [consumer]
  restart: unless-stopped

services:
  kafka:
    image: apache/kafka:4.0.0
    hostname: kafka
    ports:
      - "127.0.0.1:19092:19092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENERS: INTERNAL://:29092,CONTROLLER://:29093,EXTERNAL://:19092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://127.0.0.1:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 6
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --list >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 30

  setup:
    image: apache/kafka:4.0.0
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["sh", "-c"]
    command:
      - /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic orders --partitions 6 --replication-factor 1
    restart: "no"

  producer:
    <<: *app
    command: [producer]
    restart: unless-stopped
    depends_on:
      setup:
        condition: service_completed_successfully

  consumer-1:
    <<: *consumer
    hostname: consumer-1
    environment: {<<: *app-env, NAME: consumer-1}
    depends_on: {setup: {condition: service_completed_successfully}}
  consumer-2:
    <<: *consumer
    hostname: consumer-2
    environment: {<<: *app-env, NAME: consumer-2}
    depends_on: {setup: {condition: service_completed_successfully}}
  consumer-3:
    <<: *consumer
    hostname: consumer-3
    environment: {<<: *app-env, NAME: consumer-3}
    depends_on: {setup: {condition: service_completed_successfully}}
